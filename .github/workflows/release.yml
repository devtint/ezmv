name: Release

# Push a tag like v0.9.1 to publish a release. The tag must match
# $EzmvVersion in ezmv.ps1, and every CI job must pass first.
on:
  push:
    tags: ['v*']

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the script version
        run: |
          version=$(sed -n "s/^\$EzmvVersion = '\([^']*\)'.*/\1/p" ezmv.ps1)
          tag="${GITHUB_REF_NAME#v}"
          echo "script: $version  tag: $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag v$tag does not match \$EzmvVersion = '$version' in ezmv.ps1"
            exit 1
          fi
      - name: Build release files
        run: |
          mkdir dist
          cp ezmv.ps1 dist/
          (cd dist && sha256sum ezmv.ps1 > ezmv.ps1.sha256)
          cat dist/ezmv.ps1.sha256
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/ezmv.ps1 dist/ezmv.ps1.sha256 \
            --title "ezmv ${GITHUB_REF_NAME#v}" --generate-notes $prerelease
